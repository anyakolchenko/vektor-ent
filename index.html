<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вектор / ЕНТ — Подготовка к ЕНТ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-badge">B</div>
            <div class="brand-title">ВЕКТОР / <span class="accent">ЕНТ</span></div>
            <div class="sync-status">• прогресс сохраняется</div>
        </header>

        <main class="main-content">
            <section class="hero-card">
                <div class="hero-badges">
                    <span>Твоя подготовка к ЕНТ</span>
                    <span>Офлайн после загрузки</span>
                </div>
                <h1>Учись. Решай. Расти.</h1>
                <p>Тренируй темы, разбирай ошибки и отслеживай прогресс в одном месте.</p>
                <div class="stats-row">
                    <div><strong id="total-answered">0</strong> ответов дано</div>
                    <div><strong id="total-correct">0</strong> верных ответов</div>
                </div>
            </section>

            <section class="subjects-section">
                <h2>Выбери предмет</h2>
                <div class="subjects-grid" id="subjects-grid">
                    <!-- Рендерится динамически из script.js -->
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <span class="nav-icon">🏠</span> Главная
            </a>
            <a href="training.html" class="nav-item">
                <span class="nav-icon">📖</span> Тренировка
            </a>
            <a href="probnik.html" class="nav-item">
                <span class="nav-icon">⏱️</span> Пробник
            </a>
            <a href="progress.html" class="nav-item">
                <span class="nav-icon">📊</span> Прогресс
            </a>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
