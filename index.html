<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВЕКТОР — Тренажер ЕНТ-2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d6efd">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .subject-btn { font-weight: 600; border-radius: 20px; padding: 6px 16px; margin: 3px; }
        .subject-btn.active { background-color: #0d6efd; color: white; }
        .option-btn { text-align: left; padding: 12px 18px; border: 1px solid #dee2e6; background: #ffffff; border-radius: 10px; transition: all 0.2s; font-size: 1.05rem; }
        .option-btn:hover:not([disabled]) { background: #e9ecef; border-color: #adb5bd; }
        .option-btn.correct { background-color: #d1e7dd; border-color: #0f5132; color: #0f5132; font-weight: 600; }
        .option-btn.incorrect { background-color: #f8d7da; border-color: #842029; color: #842029; }
        .explanation-box { background-color: #e7f1ff; border-left: 5px solid #0d6efd; line-height: 1.6; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">🚀 ВЕКТОР — ЕНТ 2026</a>
        </div>
    </nav>

    <div class="container my-4">
        <div class="subject-selector d-flex flex-wrap justify-content-center mb-4">
            <button class="btn btn-outline-primary subject-btn active" data-subject="biology">🧬 Биология</button>
            <button class="btn btn-outline-primary subject-btn" data-subject="chemistry">🧪 Химия</button>
            <button class="btn btn-outline-primary subject-btn" data-subject="history_kz">🇰🇿 История Казахстана</button>
            <button class="btn btn-outline-primary subject-btn" data-subject="math_lit">📐 Мат. грамотность</button>
            <button class="btn btn-outline-primary subject-btn" data-subject="reading_lit">📖 Грамотность чтения</button>
        </div>

        <div id="quiz-container">
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
