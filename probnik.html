<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пробный тест — Вектор / ЕНТ</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: sans-serif;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        a.back { color: #38bdf8; text-decoration: none; font-size: 14px; }
        .q-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .q-title { font-weight: bold; margin-bottom: 12px; color: #38bdf8; }
        details { background: #0f172a; border-radius: 8px; padding: 8px 12px; border: 1px solid #334155; margin-top: 10px; }
        summary { cursor: pointer; color: #94a3b8; font-size: 14px; }
        .correct { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Пробный тест ЕНТ</h2>
        <a href="index.html" class="back">← На главную</a>
    </div>

    <div class="q-card">
        <div class="q-title">Математическая грамотность: Вопрос 1</div>
        <div>Периметр квадрата равен 36 см. Найдите его площадь.</div>
        <details>
            <summary>Ответ</summary>
            <div style="margin-top:8px;" class="correct">81 см²</div>
        </details>
    </div>

    <div class="q-card">
        <div class="q-title">Русский язык: Вопрос 1</div>
        <div>Укажите слово с правильным ударением:</div>
        <details>
            <summary>Ответ</summary>

        </details>
    </div>
